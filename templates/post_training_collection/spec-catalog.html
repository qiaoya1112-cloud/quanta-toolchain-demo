<section id="dc-spec-catalog" class="dc-spec-catalog">
  <div class="dc-spec-toolbar"><label><input id="dc-catalog-search" type="search" placeholder="规范名称 / 飞书链接" aria-label="搜索采集规范"></label><button type="button" id="dc-catalog-refresh">刷新</button><button type="button" class="primary" id="dc-catalog-create">新增采集规范</button></div>
  <div id="dc-catalog-error" role="alert"></div>
  <div class="dc-catalog-table-wrap"><table aria-label="采集规范"><colgroup><col style="width:24%"><col style="width:32%"><col style="width:10%"><col style="width:10%"><col style="width:16%"><col style="width:8%"></colgroup><thead><tr><th>规范名称</th><th>飞书文档</th><th>关联任务</th><th>创建人</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="dc-catalog-rows"><tr><td colspan="6">正在加载…</td></tr></tbody></table></div>
