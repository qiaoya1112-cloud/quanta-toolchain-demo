<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#68758b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4f82df"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2a9d72"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #202a3a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #68758b; }
      .layer { fill: #f8fafc; stroke: #cbd5e3; stroke-width: 1.2; }
      .layer-title { font-size: 17px; font-weight: 700; }
      .layer-note { font-size: 12px; fill: #6a7688; }
      .app { fill: #eef4ff; stroke: #668bd6; stroke-width: 1.3; }
      .service { fill: #ffffff; stroke: #8c9ab0; stroke-width: 1.25; }
      .process { fill: #f3efff; stroke: #8b6bd6; stroke-width: 1.4; }
      .interaction { fill: #eff9f5; stroke: #49a083; stroke-width: 1.4; }
      .data { fill: #fff7e8; stroke: #d99443; stroke-width: 1.4; }
      .runtime { fill: #f3f6fa; stroke: #7687a2; stroke-width: 1.3; }
      .infra { fill: #fbfcfe; stroke: #a4aebd; stroke-width: 1.2; }
      .governance { fill: #fff1f1; stroke: #d45f5f; stroke-width: 1.2; }
      .group-title { font-size: 18px; font-weight: 700; }
      .node-title { font-size: 15px; font-weight: 650; }
      .node-note { font-size: 11.5px; fill: #6a7688; }
      .key { font-size: 10.5px; fill: #4f82df; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .edge { fill: none; stroke: #68758b; stroke-width: 1.45; marker-end: url(#arrow); }
      .bind { fill: none; stroke: #4f82df; stroke-width: 1.4; stroke-dasharray: 6 5; marker-end: url(#arrow-blue); }
      .data-edge { fill: none; stroke: #2a9d72; stroke-width: 1.6; marker-end: url(#arrow-green); }
      .label { font-size: 11.5px; fill: #59667c; }
      .mini { fill: rgba(255,255,255,0.72); stroke: rgba(99,113,135,0.65); stroke-width: 1; }
    </style>
  </defs>

  <rect width="1800" height="1080" fill="#ffffff"/>

  <text x="40" y="43" class="title">功能架构图</text>
  <text x="40" y="72" class="subtitle">产品入口通过领域服务操作三类核心抽象：流程配置、任务与交互、数据与质量；发布态配置由运行引擎实例化并落入统一数据底座。</text>

  <!-- Product application layer -->
  <text x="40" y="111" class="layer-title">产品应用层</text>
  <text x="151" y="111" class="layer-note">不同角色的操作入口</text>
  <rect x="40" y="124" width="1720" height="125" rx="12" class="layer"/>

  <rect x="65" y="156" width="245" height="66" rx="9" class="app"/>
  <text x="187" y="183" text-anchor="middle" class="node-title">项目与权限</text>
  <text x="187" y="204" text-anchor="middle" class="node-note">范围 · 成员 · 标准 · 审批</text>

  <rect x="340" y="156" width="245" height="66" rx="9" class="app"/>
  <text x="462" y="183" text-anchor="middle" class="node-title">采集 / 导入管理</text>
  <text x="462" y="204" text-anchor="middle" class="node-note">创建任务 · 监控 · 重试</text>

  <rect x="615" y="156" width="245" height="66" rx="9" class="app"/>
  <text x="737" y="183" text-anchor="middle" class="node-title">流程配置中心</text>
  <text x="737" y="204" text-anchor="middle" class="node-note">编排 · 校验 · 试运行 · 发布</text>

  <rect x="890" y="156" width="245" height="66" rx="9" class="app"/>
  <text x="1012" y="183" text-anchor="middle" class="node-title">任务中心 / 工作台</text>
  <text x="1012" y="204" text-anchor="middle" class="node-note">分配 · 执行 · 验收 · 返工</text>

  <rect x="1165" y="156" width="245" height="66" rx="9" class="app"/>
  <text x="1287" y="183" text-anchor="middle" class="node-title">数据集与血缘</text>
  <text x="1287" y="204" text-anchor="middle" class="node-note">构建 · 终验 · 发布 · 追踪</text>

  <rect x="1440" y="156" width="295" height="66" rx="9" class="app"/>
  <text x="1587" y="183" text-anchor="middle" class="node-title">运营看板</text>
  <text x="1587" y="204" text-anchor="middle" class="node-note">进度 · 产能 · 返工 · 成本</text>

  <!-- Domain services -->
  <text x="40" y="286" class="layer-title">领域服务层</text>
  <text x="151" y="286" class="layer-note">稳定 API 与事件边界，不让页面直接操作底层对象</text>
  <rect x="40" y="299" width="1720" height="135" rx="12" class="layer"/>

  <rect x="65" y="336" width="245" height="62" rx="9" class="service"/>
  <text x="187" y="363" text-anchor="middle" class="node-title">项目服务</text>
  <text x="187" y="384" text-anchor="middle" class="key">ProjectService</text>
  <path d="M187 222 V336" class="edge"/>

  <rect x="340" y="336" width="245" height="62" rx="9" class="service"/>
  <text x="462" y="363" text-anchor="middle" class="node-title">数据进入服务</text>
  <text x="462" y="384" text-anchor="middle" class="key">IngestionService</text>
  <path d="M462 222 V336" class="edge"/>

  <rect x="615" y="336" width="245" height="62" rx="9" class="service"/>
  <text x="737" y="363" text-anchor="middle" class="node-title">流程服务</text>
  <text x="737" y="384" text-anchor="middle" class="key">PipelineService</text>
  <path d="M737 222 V336" class="edge"/>

  <rect x="890" y="336" width="245" height="62" rx="9" class="service"/>
  <text x="1012" y="363" text-anchor="middle" class="node-title">人工任务服务</text>
  <text x="1012" y="384" text-anchor="middle" class="key">HumanTaskService</text>
  <path d="M1012 222 V336" class="edge"/>

  <rect x="1165" y="336" width="245" height="62" rx="9" class="service"/>
  <text x="1287" y="363" text-anchor="middle" class="node-title">数据集与血缘服务</text>
  <text x="1287" y="384" text-anchor="middle" class="key">DatasetLineageService</text>
  <path d="M1287 222 V336" class="edge"/>

  <rect x="1440" y="336" width="295" height="62" rx="9" class="service"/>
  <text x="1587" y="363" text-anchor="middle" class="node-title">指标与告警服务</text>
  <text x="1587" y="384" text-anchor="middle" class="key">MetricsAlertService</text>
  <path d="M1587 222 V336" class="edge"/>

  <!-- Core abstraction plane -->
  <text x="40" y="474" class="layer-title">核心抽象层</text>
  <text x="151" y="474" class="layer-note">功能设计和技术设计共同使用的领域模型</text>
  <rect x="40" y="487" width="1720" height="260" rx="12" class="layer"/>
  <path d="M187 398 V460 H170 V513" class="bind"/>
  <path d="M462 398 V451 H700 V513" class="bind"/>
  <path d="M737 398 V440 H500 V513" class="bind"/>
  <path d="M1012 398 V465 H875 V513" class="bind"/>
  <path d="M1287 398 V451 H1450 V513" class="bind"/>
  <path d="M1587 398 V465 H1630 V513" class="bind"/>

  <!-- Process abstraction -->
  <rect x="65" y="513" width="510" height="208" rx="12" class="process"/>
  <text x="85" y="543" class="group-title">A. 流程配置模型</text>
  <text x="85" y="565" class="node-note">回答“处理逻辑如何定义、发布和实例化”</text>
  <rect x="85" y="584" width="145" height="48" rx="7" class="mini"/>
  <text x="157" y="606" text-anchor="middle" class="node-title">流程定义</text>
  <text x="157" y="623" text-anchor="middle" class="key">pipeline_definition</text>
  <rect x="245" y="584" width="145" height="48" rx="7" class="mini"/>
  <text x="317" y="606" text-anchor="middle" class="node-title">流程版本</text>
  <text x="317" y="623" text-anchor="middle" class="key">pipeline_version</text>
  <rect x="405" y="584" width="145" height="48" rx="7" class="mini"/>
  <text x="477" y="606" text-anchor="middle" class="node-title">环节 Step</text>
  <text x="477" y="623" text-anchor="middle" class="node-note">业务分组与阶段边界</text>
  <rect x="85" y="650" width="145" height="48" rx="7" class="mini"/>
  <text x="157" y="672" text-anchor="middle" class="node-title">节点 Node</text>
  <text x="157" y="689" text-anchor="middle" class="node-note">自动 / 人工 / 网关</text>
  <rect x="245" y="650" width="145" height="48" rx="7" class="mini"/>
  <text x="317" y="672" text-anchor="middle" class="node-title">流转 Transition</text>
  <text x="317" y="689" text-anchor="middle" class="node-note">条件 · 分支 · 回流</text>
  <rect x="405" y="650" width="145" height="48" rx="7" class="mini"/>
  <text x="477" y="672" text-anchor="middle" class="node-title">运行实例</text>
  <text x="477" y="689" text-anchor="middle" class="key">pipeline_run / node_run</text>
  <path d="M230 608 H245" class="bind"/>
  <path d="M390 608 H405" class="bind"/>
  <path d="M230 674 H245" class="edge"/>
  <path d="M390 674 H405" class="edge"/>
  <path d="M477 632 V640 H157 V650" class="bind"/>

  <!-- Interaction abstraction -->
  <rect x="600" y="513" width="550" height="208" rx="12" class="interaction"/>
  <text x="620" y="543" class="group-title">B. 任务与交互模型</text>
  <text x="620" y="565" class="node-note">回答“谁以什么工具完成哪一份工作”</text>
  <rect x="620" y="584" width="160" height="48" rx="7" class="mini"/>
  <text x="700" y="606" text-anchor="middle" class="node-title">业务任务</text>
  <text x="700" y="623" text-anchor="middle" class="node-note">采集 / 导入 / 处理</text>
  <rect x="795" y="584" width="160" height="48" rx="7" class="mini"/>
  <text x="875" y="606" text-anchor="middle" class="node-title">人工任务</text>
  <text x="875" y="623" text-anchor="middle" class="key">human_task</text>
  <rect x="970" y="584" width="160" height="48" rx="7" class="mini"/>
  <text x="1050" y="606" text-anchor="middle" class="node-title">任务池</text>
  <text x="1050" y="623" text-anchor="middle" class="node-note">分配 · 优先级 · SLA</text>
  <rect x="620" y="650" width="160" height="48" rx="7" class="mini"/>
  <text x="700" y="672" text-anchor="middle" class="node-title">工作台 Schema</text>
  <text x="700" y="689" text-anchor="middle" class="node-note">布局与组件绑定</text>
  <rect x="795" y="650" width="160" height="48" rx="7" class="mini"/>
  <text x="875" y="672" text-anchor="middle" class="node-title">交互组件注册表</text>
  <text x="875" y="689" text-anchor="middle" class="node-note">预览 · 标注 · 结论 · 证据</text>
  <rect x="970" y="650" width="160" height="48" rx="7" class="mini"/>
  <text x="1050" y="672" text-anchor="middle" class="node-title">任务执行记录</text>
  <text x="1050" y="689" text-anchor="middle" class="node-note">操作、提交与耗时</text>
  <path d="M780 608 H795" class="edge"/>
  <path d="M955 608 H970" class="edge"/>
  <path d="M780 674 H795" class="bind"/>
  <path d="M955 674 H970" class="edge"/>

  <!-- Data abstraction -->
  <rect x="1175" y="513" width="560" height="208" rx="12" class="data"/>
  <text x="1195" y="543" class="group-title">C. 数据、质量与版本模型</text>
  <text x="1195" y="565" class="node-note">回答“处理了哪版数据、为何通过、如何追溯”</text>
  <rect x="1195" y="584" width="160" height="48" rx="7" class="mini"/>
  <text x="1275" y="606" text-anchor="middle" class="node-title">Recording / Episode</text>
  <text x="1275" y="623" text-anchor="middle" class="node-note">原始记录与可处理片段</text>
  <rect x="1370" y="584" width="160" height="48" rx="7" class="mini"/>
  <text x="1450" y="606" text-anchor="middle" class="node-title">数据快照 / 数据集版本</text>
  <text x="1450" y="623" text-anchor="middle" class="node-note">运行输入与发布资产</text>
  <rect x="1545" y="584" width="170" height="48" rx="7" class="mini"/>
  <text x="1630" y="606" text-anchor="middle" class="node-title">血缘 Lineage</text>
  <text x="1630" y="623" text-anchor="middle" class="node-note">输入、输出、规则与人员</text>
  <rect x="1195" y="650" width="160" height="48" rx="7" class="mini"/>
  <text x="1275" y="672" text-anchor="middle" class="node-title">规则 / 策略版本</text>
  <text x="1275" y="689" text-anchor="middle" class="node-note">阈值、抽检与判定方式</text>
  <rect x="1370" y="650" width="160" height="48" rx="7" class="mini"/>
  <text x="1450" y="672" text-anchor="middle" class="node-title">质检节点 / 质量结果</text>
  <text x="1450" y="689" text-anchor="middle" class="node-note">PASS / REVIEW / REJECT</text>
  <rect x="1545" y="650" width="170" height="48" rx="7" class="mini"/>
  <text x="1630" y="672" text-anchor="middle" class="node-title">证据 / 返工 / 审计</text>
  <text x="1630" y="689" text-anchor="middle" class="node-note">保留历史，不覆盖结论</text>
  <path d="M1355 608 H1370" class="data-edge"/>
  <path d="M1530 608 H1545" class="data-edge"/>
  <path d="M1355 674 H1370" class="edge"/>
  <path d="M1530 674 H1545" class="edge"/>

  <!-- Cross abstraction relations -->
  <path d="M575 600 H600" class="edge"/>
  <text x="587" y="589" text-anchor="middle" class="label">实例化任务</text>
  <path d="M1150 600 H1175" class="data-edge"/>
  <text x="1162" y="589" text-anchor="middle" class="label">读写数据</text>
  <path d="M1175 705 H1140 V715 H575 V690" class="bind"/>
  <text x="850" y="711" text-anchor="middle" class="label">数据快照、质量结果与版本关系回写运行实例</text>

  <!-- Governance bar -->
  <rect x="65" y="763" width="1670" height="47" rx="9" class="governance"/>
  <text x="95" y="792" class="node-title">横向治理：</text>
  <text x="200" y="792" class="node-note">租户与项目权限　·　版本发布与冻结　·　幂等与并发控制　·　操作审计　·　指标与告警　·　API / Webhook</text>

  <!-- Runtime layer -->
  <text x="40" y="845" class="layer-title">执行与编排层</text>
  <text x="151" y="845" class="layer-note">只运行已发布配置；每次执行生成独立记录</text>
  <rect x="40" y="858" width="1720" height="100" rx="12" class="layer"/>
  <rect x="75" y="880" width="280" height="55" rx="9" class="runtime"/>
  <text x="215" y="905" text-anchor="middle" class="node-title">工作流引擎</text>
  <text x="215" y="923" text-anchor="middle" class="node-note">状态机 · 分支 · 回流 · 重试</text>
  <rect x="390" y="880" width="280" height="55" rx="9" class="runtime"/>
  <text x="530" y="905" text-anchor="middle" class="node-title">算子运行时</text>
  <text x="530" y="923" text-anchor="middle" class="node-note">镜像 · 参数 · 资源 · 日志</text>
  <rect x="705" y="880" width="280" height="55" rx="9" class="runtime"/>
  <text x="845" y="905" text-anchor="middle" class="node-title">人工任务运行时</text>
  <text x="845" y="923" text-anchor="middle" class="node-note">分配 · 锁定 · 提交 · 超时</text>
  <rect x="1020" y="880" width="300" height="55" rx="9" class="runtime"/>
  <text x="1170" y="905" text-anchor="middle" class="node-title">规则与流转引擎</text>
  <text x="1170" y="923" text-anchor="middle" class="node-note">规则执行 · 抽检 · 结果路由 · 改判</text>
  <rect x="1355" y="880" width="370" height="55" rx="9" class="runtime"/>
  <text x="1540" y="905" text-anchor="middle" class="node-title">调度与事件总线</text>
  <text x="1540" y="923" text-anchor="middle" class="node-note">依赖触发 · 优先级 · 通知 · Webhook</text>
  <path d="M320 721 V770" class="edge"/>
  <path d="M875 721 V770" class="edge"/>
  <path d="M1450 721 V770" class="edge"/>
  <path d="M320 810 V858" class="edge"/>
  <path d="M875 810 V858" class="edge"/>
  <path d="M1450 810 V858" class="edge"/>

  <!-- Data platform layer -->
  <text x="40" y="994" class="layer-title">数据与平台底座</text>
  <rect x="40" y="1007" width="1720" height="55" rx="12" class="layer"/>
  <rect x="70" y="1018" width="300" height="33" rx="7" class="infra"/>
  <text x="220" y="1040" text-anchor="middle" class="node-title">元数据与配置库</text>
  <rect x="400" y="1018" width="300" height="33" rx="7" class="infra"/>
  <text x="550" y="1040" text-anchor="middle" class="node-title">任务 / 质量 / 审计库</text>
  <rect x="730" y="1018" width="300" height="33" rx="7" class="infra"/>
  <text x="880" y="1040" text-anchor="middle" class="node-title">对象存储 / 数据湖</text>
  <rect x="1060" y="1018" width="300" height="33" rx="7" class="infra"/>
  <text x="1210" y="1040" text-anchor="middle" class="node-title">Catalog / 检索 / 预览</text>
  <rect x="1390" y="1018" width="340" height="33" rx="7" class="infra"/>
  <text x="1560" y="1040" text-anchor="middle" class="node-title">计算资源 / 队列 / 日志监控</text>
  <path d="M215 935 V1007" class="data-edge"/>
  <path d="M845 935 V1007" class="data-edge"/>
  <path d="M1170 935 V1007" class="data-edge"/>
  <path d="M1540 935 V1007" class="data-edge"/>
</svg>
