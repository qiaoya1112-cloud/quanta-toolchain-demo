<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1360" viewBox="0 0 1900 1360">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1F2937; }
      .title { font-size: 38px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #64748B; }
      .zone-title { font-size: 21px; font-weight: 700; }
      .element-title { font-size: 17px; font-weight: 700; }
      .key { font-size: 13px; fill: #64748B; font-family: "SFMono-Regular", Consolas, monospace; }
      .ui-title { font-size: 16px; font-weight: 600; }
      .ui-text { font-size: 15px; fill: #475569; }
      .ui-small { font-size: 13px; fill: #64748B; }
      .inverse { fill: #FFFFFF; }
      .video-label { fill: #DCE7EC; }
      .zone { fill: #FFFFFF; stroke: #149DAA; stroke-width: 2.5; }
      .zone-head { fill: #EAF7F8; stroke: #149DAA; stroke-width: 1.5; }
      .element { fill: #FFFFFF; stroke: #AEBCC9; stroke-width: 1.4; }
      .element-active { fill: #FFFFFF; stroke: #149DAA; stroke-width: 2; }
      .element-head { fill: #F3F8F9; stroke: #D3E8EA; stroke-width: 1; }
      .soft { fill: #F8FAFC; stroke: #D8E0E8; stroke-width: 1.2; }
      .active-tab { fill: #149DAA; stroke: #149DAA; stroke-width: 1.5; }
      .button { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1.2; }
      .button-primary { fill: #149DAA; stroke: #149DAA; stroke-width: 1.2; }
      .line { stroke: #94A3B8; stroke-width: 1.5; fill: none; }
      .accent { fill: #149DAA; stroke: #149DAA; }
    </style>
  </defs>

  <rect width="1900" height="1360" fill="#F5F7FA"/>
  <text x="52" y="58" class="title">标注工作台分区与组件示意图</text>
  <text x="52" y="88" class="subtitle">按照 01 数据信息、02 视频与时序、03 工作区切换、04 通用操作区组织；框内标注格式为「模块｜元素｜类型」</text>
  <g transform="translate(1368,42)">
    <rect x="0" y="0" width="452" height="48" rx="8" fill="#FFFFFF" stroke="#D8E0E8"/>
    <rect x="18" y="14" width="24" height="20" rx="4" fill="#EAF7F8" stroke="#149DAA" stroke-width="2"/>
    <text x="52" y="29" class="ui-small">青色边框：一级分区及当前标注工作区</text>
  </g>

  <rect x="40" y="112" width="1820" height="1200" rx="18" fill="#FFFFFF" stroke="#B8C4D1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="112" width="1820" height="54" rx="18" fill="#1E3442"/>
  <rect x="40" y="145" width="1820" height="21" fill="#1E3442"/>
  <text x="70" y="146" class="inverse" font-size="20" font-weight="700">标注工作台 · 动作分段标注</text>
  <text x="1792" y="145" class="video-label" font-size="14" text-anchor="end">示例 Schema：wb.action-annotation@4.1</text>

  <!-- 01 数据信息 -->
  <g>
    <rect x="68" y="184" width="1764" height="158" rx="12" class="zone"/>
    <rect x="68" y="184" width="224" height="38" rx="10" class="zone-head"/>
    <text x="88" y="211" class="zone-title">01　数据信息</text>

    <rect x="88" y="236" width="690" height="86" rx="8" class="element"/>
    <rect x="88" y="236" width="326" height="30" rx="7" class="element-head"/>
    <text x="103" y="257" class="element-title">数据信息｜数据信息｜—</text>
    <text x="104" y="287" class="ui-small">任务 ID　WB-0922-LB　　数据 ID　3298698　　版本　第 1 版</text>
    <text x="104" y="308" class="ui-small">流程　家居动作标注 v2　　节点　动作分段标注　　状态　待标注</text>

    <rect x="798" y="236" width="1014" height="86" rx="8" class="element"/>
    <rect x="798" y="236" width="326" height="30" rx="7" class="element-head"/>
    <text x="813" y="257" class="element-title">数据信息｜指令说明｜—</text>
    <text x="814" y="287" class="ui-small">任务描述</text>
    <text x="814" y="309" class="ui-text">用抹布擦拭桌下柜子内部，并将地面散落的纸张收纳到柜子里。</text>
  </g>

  <!-- 02 视频与时序 -->
  <g>
    <rect x="68" y="360" width="1764" height="456" rx="12" class="zone"/>
    <rect x="68" y="360" width="258" height="38" rx="10" class="zone-head"/>
    <text x="88" y="387" class="zone-title">02　视频与时序</text>

    <rect x="88" y="412" width="1724" height="236" rx="9" class="element"/>
    <rect x="88" y="412" width="410" height="32" rx="7" class="element-head"/>
    <text x="104" y="435" class="element-title">视频与时序｜多视角视频｜—</text>
    <text x="516" y="434" class="key">multi_view_video</text>

    <g transform="translate(108,460)">
      <rect x="0" y="0" width="534" height="166" rx="8" fill="#1F2A34"/>
      <text x="18" y="28" class="video-label" font-size="15" font-weight="600">左臂视角</text>
      <circle cx="267" cy="84" r="25" fill="#FFFFFF" opacity="0.92"/>
      <path d="M261 71 L261 97 L282 84 Z" fill="#149DAA"/>
    </g>
    <g transform="translate(683,460)">
      <rect x="0" y="0" width="534" height="166" rx="8" fill="#1F2A34"/>
      <text x="18" y="28" class="video-label" font-size="15" font-weight="600">头部视角</text>
      <circle cx="267" cy="84" r="25" fill="#FFFFFF" opacity="0.92"/>
      <path d="M261 71 L261 97 L282 84 Z" fill="#149DAA"/>
    </g>
    <g transform="translate(1258,460)">
      <rect x="0" y="0" width="534" height="166" rx="8" fill="#1F2A34"/>
      <text x="18" y="28" class="video-label" font-size="15" font-weight="600">右臂视角</text>
      <circle cx="267" cy="84" r="25" fill="#FFFFFF" opacity="0.92"/>
      <path d="M261 71 L261 97 L282 84 Z" fill="#149DAA"/>
    </g>

    <rect x="88" y="664" width="1724" height="132" rx="9" class="element"/>
    <rect x="88" y="664" width="410" height="32" rx="7" class="element-head"/>
    <text x="104" y="687" class="element-title">视频与时序｜播放时间轴｜—</text>
    <text x="516" y="686" class="key">playback_timeline</text>
    <g transform="translate(108,714)">
      <text x="0" y="12" class="ui-small">0.00s</text>
      <text x="414" y="12" class="ui-small">10.00s</text>
      <text x="828" y="12" class="ui-small">20.00s</text>
      <text x="1242" y="12" class="ui-small">30.00s</text>
      <text x="1678" y="12" text-anchor="end" class="ui-small">42.80s</text>
      <rect x="0" y="24" width="1684" height="16" rx="8" fill="#E8EDF2"/>
      <rect x="0" y="24" width="76" height="16" rx="8" fill="#64748B"/>
      <rect x="76" y="24" width="1608" height="16" rx="8" fill="#149DAA" opacity="0.76"/>
      <path d="M552 17 V49" stroke="#149DAA" stroke-width="3"/>
      <path d="M698 17 V49" stroke="#149DAA" stroke-width="3"/>
      <rect x="0" y="52" width="42" height="28" rx="6" class="button"/><text x="21" y="72" text-anchor="middle" class="ui-title">«</text>
      <rect x="50" y="52" width="50" height="28" rx="6" class="button"/><text x="75" y="72" text-anchor="middle" class="ui-small">1×</text>
      <rect x="108" y="52" width="42" height="28" rx="6" class="button"/><text x="129" y="72" text-anchor="middle" class="ui-title">»</text>
      <rect x="158" y="52" width="42" height="28" rx="6" class="button-primary"/><text x="179" y="72" text-anchor="middle" class="inverse" font-size="14">▶</text>
      <text x="224" y="72" class="ui-small">截帧　插入　区间编辑　切分　删除　书签</text>
    </g>
  </g>

  <!-- 03 工作区切换 -->
  <g>
    <rect x="68" y="834" width="1764" height="320" rx="12" class="zone"/>
    <rect x="68" y="834" width="460" height="38" rx="10" class="zone-head"/>
    <text x="88" y="861" class="zone-title">03　工作区切换｜tab｜—</text>

    <rect x="88" y="888" width="350" height="58" rx="8" class="element"/>
    <text x="104" y="911" class="element-title">数据辅助区｜轨迹信息｜—</text>
    <text x="104" y="934" class="key">trajectory_viewer</text>

    <rect x="452" y="888" width="350" height="58" rx="8" class="element"/>
    <text x="468" y="911" class="element-title">质检工作区｜质检编辑器｜—</text>
    <text x="468" y="934" class="key">quality_result_viewer · 标注页只读</text>

    <rect x="816" y="888" width="504" height="58" rx="8" class="active-tab"/>
    <text x="832" y="912" class="inverse" font-size="17" font-weight="700">标注工作区｜标注编辑器｜动作标注</text>
    <text x="832" y="935" class="inverse" font-size="13" opacity="0.84">annotation_segment_editor · 当前页签</text>

    <rect x="1334" y="888" width="458" height="58" rx="8" class="element"/>
    <text x="1350" y="911" class="element-title">数据辅助区｜日志信息｜—</text>
    <text x="1350" y="934" class="key">workbench_log</text>

    <rect x="88" y="962" width="1724" height="172" rx="9" class="element-active"/>
    <rect x="104" y="978" width="1688" height="140" rx="8" class="soft"/>
    <rect x="104" y="978" width="360" height="30" rx="7" class="element-head"/>
    <text x="120" y="999" class="element-title">标注工作区｜标注编辑器｜动作标注</text>
    <text x="122" y="1033" class="ui-small">时间片段</text>
    <text x="386" y="1033" class="ui-small">动作元素</text>
    <text x="738" y="1033" class="ui-small">动作描述</text>
    <text x="1400" y="1033" class="ui-small">缩略图</text>
    <text x="1600" y="1033" class="ui-small">操作</text>
    <line x1="120" y1="1044" x2="1776" y2="1044" class="line"/>
    <text x="122" y="1070" class="ui-text">0.00s – 1.94s</text>
    <text x="386" y="1070" class="ui-text">无法标注</text>
    <text x="738" y="1070" class="ui-text">画面不可用，无法判断动作内容</text>
    <text x="1400" y="1070" class="ui-text">—</text>
    <text x="1600" y="1070" class="ui-text">定位　编辑　删除</text>
    <text x="122" y="1100" class="ui-text">1.94s – 42.80s</text>
    <text x="386" y="1100" class="ui-text">抓取 / 移动 / 放置</text>
    <text x="738" y="1100" class="ui-text">分捡药片并放入盘中</text>
    <text x="1400" y="1100" class="ui-text">预览</text>
    <text x="1600" y="1100" class="ui-text">定位　编辑　删除</text>
  </g>

  <!-- 04 通用操作区 -->
  <g>
    <rect x="68" y="1172" width="1764" height="116" rx="12" class="zone"/>
    <rect x="68" y="1172" width="258" height="38" rx="10" class="zone-head"/>
    <text x="88" y="1199" class="zone-title">04　通用操作区</text>

    <rect x="88" y="1216" width="1724" height="54" rx="8" class="element"/>
    <rect x="88" y="1216" width="490" height="30" rx="7" class="element-head"/>
    <text x="104" y="1237" class="element-title">通用操作区｜任务操作｜流程操作</text>
    <text x="594" y="1236" class="key">task_actions</text>
    <rect x="886" y="1226" width="130" height="32" rx="7" class="button"/>
    <text x="951" y="1248" text-anchor="middle" class="ui-text">重置</text>
    <rect x="1028" y="1226" width="130" height="32" rx="7" class="button"/>
    <text x="1093" y="1248" text-anchor="middle" class="ui-text">暂离</text>
    <rect x="1170" y="1226" width="130" height="32" rx="7" class="button"/>
    <text x="1235" y="1248" text-anchor="middle" class="ui-text">驳回</text>
    <rect x="1312" y="1226" width="180" height="32" rx="7" class="button-primary"/>
    <text x="1402" y="1248" text-anchor="middle" class="inverse" font-size="14" font-weight="700">提交标注结果</text>
    <text x="1512" y="1248" class="ui-small">结论选择仅质检工作台挂载</text>
  </g>

  <text x="52" y="1336" class="ui-small">分区原则：数据说明与任务元信息归入 01；视频和时间轴归入 02；轨迹、质检、标注、日志通过 03 页签切换；04 只承载跨工作台的流程操作。</text>
</svg>
