<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">Quanta 数据平台端到端业务流程</title>
  <desc id="desc">展示从项目配置、数据采集或导入、处理任务、清洗和标注流程、数据集构建到发布消费的主流程，以及自动节点、人工节点的执行方式和数据版本血缘。</desc>
  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0 0 L0 8 L10 4 Z" fill="#65728a"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0 0 L0 8 L10 4 Z" fill="#4f82df"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0 0 L0 8 L10 4 Z" fill="#2a9d72"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #202a3a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #68758b; }
      .lane { fill: #fbfcfe; stroke: #c9d3e1; stroke-width: 1.2; }
      .phase { fill: #f8fafc; stroke: #ccd5e3; stroke-width: 1.2; }
      .phase-process { fill: #f3f6fb; stroke: #9eacc1; stroke-width: 1.3; }
      .phase-title { font-size: 16px; font-weight: 700; }
      .phase-no { font-size: 12px; font-weight: 700; fill: #59667c; }
      .lane-title { font-size: 17px; font-weight: 700; }
      .node { fill: #ffffff; stroke: #8d9bb0; stroke-width: 1.2; }
      .node-blue { fill: #ffffff; stroke: #8d9bb0; stroke-width: 1.2; }
      .node-green { fill: #ffffff; stroke: #8d9bb0; stroke-width: 1.2; }
      .step { fill: #ffffff; stroke: #71839e; stroke-width: 1.3; }
      .step-head { fill: #f3f6fa; stroke: #9eacc1; stroke-width: 1; }
      .node-title { font-size: 15px; font-weight: 650; }
      .node-note { font-size: 11.5px; fill: #68758b; }
      .key { font-size: 10.5px; fill: #59667c; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .edge { fill: none; stroke: #65728a; stroke-width: 1.5; marker-end: url(#arrow-gray); }
      .bind { fill: none; stroke: #4f82df; stroke-width: 1.4; stroke-dasharray: 6 5; marker-end: url(#arrow-blue); }
      .pass { fill: none; stroke: #2a9d72; stroke-width: 1.7; marker-end: url(#arrow-green); }
      .label { font-size: 11px; fill: #59667c; }
      .label-pass { font-size: 11px; font-weight: 650; fill: #23815e; }
      .pill { fill: #f3f6fa; stroke: #91a0b6; stroke-width: 1.2; }
      .caption { font-size: 12px; fill: #68758b; }
    </style>
  </defs>

  <rect width="1800" height="1080" fill="#ffffff"/>
  <text x="40" y="43" class="title">端到端业务流程图</text>
  <text x="40" y="72" class="subtitle">一条主线说明业务推进；处理任务只保留“清洗、标注”两个环节，具体检查、抽样和验收作为可配置节点；自动与人工节点共用统一结果回写方式。</text>
  <path d="M1315 43 H1355" class="edge"/>
  <text x="1365" y="48" class="label">主流程</text>
  <path d="M1440 43 H1480" class="bind"/>
  <text x="1490" y="48" class="label">版本绑定</text>
  <path d="M1570 43 H1610" class="pass"/>
  <text x="1620" y="48" class="label">继续 / 发布</text>

  <!-- Main business flow -->
  <text x="40" y="108" class="lane-title">主业务流程</text>
  <rect x="40" y="122" width="1720" height="365" rx="12" class="lane"/>

  <!-- 01 -->
  <rect x="60" y="145" width="190" height="315" rx="11" class="phase"/>
  <text x="78" y="171" class="phase-no">01</text>
  <text x="106" y="171" class="phase-title">项目与配置准备</text>
  <rect x="82" y="205" width="146" height="52" rx="8" class="node-blue"/>
  <text x="155" y="227" text-anchor="middle" class="node-title">项目 Project</text>
  <text x="155" y="245" text-anchor="middle" class="node-note">范围 · 成员 · 权限</text>
  <path d="M155 257 V275" class="edge"/>
  <rect x="82" y="275" width="146" height="72" rx="8" class="node-blue"/>
  <text x="155" y="298" text-anchor="middle" class="node-title">场景与流程版本</text>
  <text x="155" y="318" text-anchor="middle" class="node-note">Scene Config</text>
  <text x="155" y="336" text-anchor="middle" class="node-note">Pipeline Version</text>
  <path d="M155 347 V365" class="edge"/>
  <rect x="82" y="365" width="146" height="55" rx="8" class="node-green"/>
  <text x="155" y="389" text-anchor="middle" class="node-title">生产配置就绪</text>
  <text x="155" y="407" text-anchor="middle" class="node-note">固定发布版本</text>

  <!-- 02 -->
  <rect x="270" y="145" width="220" height="315" rx="11" class="phase"/>
  <text x="288" y="171" class="phase-no">02</text>
  <text x="316" y="171" class="phase-title">数据进入</text>
  <rect x="292" y="205" width="176" height="56" rx="8" class="node-blue"/>
  <text x="380" y="228" text-anchor="middle" class="node-title">采集任务</text>
  <text x="380" y="247" text-anchor="middle" class="key">data_collection_task</text>
  <rect x="292" y="278" width="176" height="56" rx="8" class="node-blue"/>
  <text x="380" y="301" text-anchor="middle" class="node-title">导入任务</text>
  <text x="380" y="320" text-anchor="middle" class="key">data_import_task</text>
  <path d="M325 261 V346 H350 V365" class="edge"/>
  <path d="M435 334 V346 H410 V365" class="edge"/>
  <rect x="292" y="365" width="176" height="55" rx="8" class="node-green"/>
  <text x="380" y="389" text-anchor="middle" class="node-title">Recording</text>
  <text x="380" y="407" text-anchor="middle" class="node-note">统一标识原始记录</text>

  <!-- 03 -->
  <rect x="510" y="145" width="220" height="315" rx="11" class="phase"/>
  <text x="528" y="171" class="phase-no">03</text>
  <text x="556" y="171" class="phase-title">处理任务启动</text>
  <rect x="532" y="205" width="176" height="58" rx="8" class="node-blue"/>
  <text x="620" y="228" text-anchor="middle" class="node-title">处理任务</text>
  <text x="620" y="248" text-anchor="middle" class="key">data_processing_task</text>
  <path d="M620 263 V282" class="edge"/>
  <rect x="532" y="282" width="176" height="72" rx="8" class="node"/>
  <text x="620" y="305" text-anchor="middle" class="node-title">固定输入与配置</text>
  <text x="620" y="325" text-anchor="middle" class="node-note">Data Snapshot</text>
  <text x="620" y="343" text-anchor="middle" class="node-note">Pipeline Version</text>
  <path d="M620 354 V372" class="edge"/>
  <rect x="532" y="372" width="176" height="55" rx="8" class="node-green"/>
  <text x="620" y="396" text-anchor="middle" class="node-title">Pipeline Run</text>
  <text x="620" y="414" text-anchor="middle" class="key">pipeline_run</text>

  <!-- 04 -->
  <rect x="750" y="145" width="510" height="315" rx="11" class="phase-process"/>
  <text x="768" y="171" class="phase-no">04</text>
  <text x="796" y="171" class="phase-title">可配置处理流程</text>
  <text x="1238" y="171" text-anchor="end" class="node-note">两个业务环节；每个环节由多个自动或人工节点构成</text>

  <rect x="775" y="205" width="215" height="180" rx="10" class="step"/>
  <rect x="790" y="220" width="185" height="40" rx="7" class="step-head"/>
  <text x="882" y="246" text-anchor="middle" class="node-title">清洗环节</text>
  <rect x="800" y="280" width="72" height="44" rx="7" class="node"/>
  <text x="836" y="307" text-anchor="middle" class="node-note">Node 1</text>
  <path d="M872 302 H892" class="edge"/>
  <rect x="892" y="280" width="72" height="44" rx="7" class="node"/>
  <text x="928" y="307" text-anchor="middle" class="node-note">Node 2</text>
  <text x="882" y="349" text-anchor="middle" class="node-note">… Node N</text>
  <text x="882" y="371" text-anchor="middle" class="node-note">清洗 · 转换 · 切分 · 检查</text>

  <path d="M990 295 H1020" class="edge"/>

  <rect x="1020" y="205" width="215" height="180" rx="10" class="step"/>
  <rect x="1035" y="220" width="185" height="40" rx="7" class="step-head"/>
  <text x="1127" y="246" text-anchor="middle" class="node-title">标注环节</text>
  <rect x="1045" y="280" width="72" height="44" rx="7" class="node"/>
  <text x="1081" y="307" text-anchor="middle" class="node-note">Node 1</text>
  <path d="M1117 302 H1137" class="edge"/>
  <rect x="1137" y="280" width="72" height="44" rx="7" class="node"/>
  <text x="1173" y="307" text-anchor="middle" class="node-note">Node 2</text>
  <text x="1127" y="349" text-anchor="middle" class="node-note">… Node N</text>
  <text x="1127" y="371" text-anchor="middle" class="node-note">标注 · 修订 · 抽样 · 验收</text>

  <rect x="875" y="400" width="260" height="42" rx="8" class="node-green"/>
  <text x="1005" y="426" text-anchor="middle" class="node-title">候选 Data Snapshot + 处理结果</text>
  <path d="M1127 385 V392 H1070 V400" class="edge"/>

  <!-- 05 -->
  <rect x="1280" y="145" width="240" height="315" rx="11" class="phase"/>
  <text x="1298" y="171" class="phase-no">05</text>
  <text x="1326" y="171" class="phase-title">数据集构建与发布</text>
  <text x="1400" y="195" text-anchor="middle" class="node-note">归属数据资产模块</text>
  <rect x="1305" y="225" width="190" height="58" rx="8" class="node-blue"/>
  <text x="1400" y="249" text-anchor="middle" class="node-title">数据集构建</text>
  <text x="1400" y="269" text-anchor="middle" class="node-note">筛选 · 组合 · 去重</text>
  <path d="M1400 283 V305" class="edge"/>
  <rect x="1305" y="305" width="190" height="58" rx="8" class="node"/>
  <text x="1400" y="329" text-anchor="middle" class="node-title">冻结候选快照</text>
  <text x="1400" y="349" text-anchor="middle" class="node-note">生成血缘与版本说明</text>
  <path d="M1400 363 V385" class="pass"/>
  <rect x="1305" y="385" width="190" height="55" rx="8" class="node-green"/>
  <text x="1400" y="409" text-anchor="middle" class="node-title">Dataset Version</text>
  <text x="1400" y="427" text-anchor="middle" class="key">dataset_version</text>

  <!-- 06 -->
  <rect x="1540" y="145" width="200" height="315" rx="11" class="phase"/>
  <text x="1558" y="171" class="phase-no">06</text>
  <text x="1586" y="171" class="phase-title">消费与交付</text>
  <rect x="1562" y="235" width="156" height="62" rx="8" class="node-blue"/>
  <text x="1640" y="260" text-anchor="middle" class="node-title">训练 / 评测</text>
  <text x="1640" y="280" text-anchor="middle" class="node-note">固定引用版本</text>
  <rect x="1562" y="320" width="156" height="62" rx="8" class="node-blue"/>
  <text x="1640" y="345" text-anchor="middle" class="node-title">交付 / API</text>
  <text x="1640" y="365" text-anchor="middle" class="node-note">版本订阅与导出</text>

  <!-- Main flow edges -->
  <path d="M228 392 H258 V233 H292" class="edge"/>
  <path d="M468 392 H500 V234 H532" class="edge"/>
  <path d="M708 400 H740 V295 H775" class="edge"/>
  <path d="M1135 421 H1270 V254 H1305" class="pass"/>
  <text x="1212" y="410" class="label-pass">提交候选快照</text>
  <path d="M1495 412 H1530 V266 H1562" class="pass"/>
  <text x="1505" y="399" class="label-pass">发布</text>
  <path d="M228 311 H255 V445 H500 V318 H532" class="bind"/>
  <text x="375" y="438" text-anchor="middle" class="label">项目与流程版本固定绑定</text>

  <!-- Node execution detail -->
  <text x="40" y="528" class="lane-title">流程节点如何执行</text>
  <text x="208" y="528" class="caption">这是“可配置处理流程”的执行细节，不是新的业务阶段：自动节点交给算子，人工节点分配到工作台，两种路径都把结果返回原流程。</text>
  <rect x="40" y="542" width="1720" height="260" rx="12" class="lane"/>

  <rect x="70" y="635" width="165" height="62" rx="9" class="node"/>
  <text x="152" y="661" text-anchor="middle" class="node-title">流程运行到某节点</text>
  <text x="152" y="682" text-anchor="middle" class="node-note">清洗或标注环节</text>

  <!-- Automatic path -->
  <path d="M235 666 H270 V620 H300" class="edge"/>
  <rect x="300" y="590" width="130" height="60" rx="9" class="node"/>
  <text x="365" y="616" text-anchor="middle" class="node-title">自动节点</text>
  <text x="365" y="637" text-anchor="middle" class="node-note">按算子版本运行</text>
  <path d="M430 620 H470" class="edge"/>
  <rect x="470" y="590" width="180" height="60" rx="9" class="node"/>
  <text x="560" y="616" text-anchor="middle" class="node-title">算子执行</text>
  <text x="560" y="637" text-anchor="middle" class="node-note">输入 → 处理 → 输出</text>
  <path d="M650 620 H720" class="edge"/>
  <rect x="720" y="590" width="160" height="60" rx="9" class="node"/>
  <text x="800" y="616" text-anchor="middle" class="node-title">返回节点结果</text>
  <text x="800" y="637" text-anchor="middle" class="node-note">状态 · 输出 · 日志</text>

  <!-- Human path -->
  <path d="M235 666 H270 V731 H300" class="edge"/>
  <rect x="300" y="700" width="130" height="62" rx="9" class="node"/>
  <text x="365" y="726" text-anchor="middle" class="node-title">人工节点</text>
  <text x="365" y="747" text-anchor="middle" class="node-note">需要人工操作</text>
  <path d="M430 731 H460" class="edge"/>
  <rect x="460" y="700" width="165" height="62" rx="9" class="node"/>
  <text x="542" y="726" text-anchor="middle" class="node-title">生成 Human Task</text>
  <text x="542" y="747" text-anchor="middle" class="node-note">形成待分配任务</text>
  <path d="M625 731 H655" class="edge"/>
  <rect x="655" y="700" width="165" height="62" rx="9" class="node"/>
  <text x="737" y="726" text-anchor="middle" class="node-title">分配管理</text>
  <text x="737" y="747" text-anchor="middle" class="node-note">任务池 · 路由 · SLA</text>
  <path d="M820 731 H850" class="edge"/>
  <rect x="850" y="700" width="165" height="62" rx="9" class="node"/>
  <text x="932" y="726" text-anchor="middle" class="node-title">工作台执行</text>
  <text x="932" y="747" text-anchor="middle" class="node-note">操作 · 暂存 · 提交</text>
  <path d="M1015 731 H1045" class="edge"/>
  <rect x="1045" y="700" width="165" height="62" rx="9" class="node"/>
  <text x="1127" y="726" text-anchor="middle" class="node-title">返回节点结果</text>
  <text x="1127" y="747" text-anchor="middle" class="node-note">结论 · 证据 · 版本</text>

  <!-- Merge and return to workflow -->
  <path d="M880 620 H1230 V650" class="edge"/>
  <path d="M1210 731 H1230 V650" class="edge"/>
  <rect x="1230" y="620" width="180" height="62" rx="9" class="node"/>
  <text x="1320" y="646" text-anchor="middle" class="node-title">结果回写流程</text>
  <text x="1320" y="667" text-anchor="middle" class="node-note">更新 Node Run 状态</text>
  <path d="M1410 651 H1450" class="pass"/>
  <text x="1430" y="638" text-anchor="middle" class="label-pass">继续</text>
  <rect x="1450" y="620" width="200" height="62" rx="9" class="node"/>
  <text x="1550" y="646" text-anchor="middle" class="node-title">下一个节点 / 环节</text>
  <text x="1550" y="667" text-anchor="middle" class="node-note">沿已发布流程运行</text>

  <path d="M1005 460 V542" class="bind"/>
  <text x="1016" y="515" class="label">模块展开</text>

  <!-- Data lineage -->
  <text x="40" y="844" class="lane-title">数据版本演进与血缘</text>
  <rect x="40" y="858" width="1720" height="145" rx="12" class="lane"/>
  <rect x="90" y="895" width="230" height="62" rx="31" class="pill"/>
  <text x="205" y="921" text-anchor="middle" class="node-title">Recording</text>
  <text x="205" y="941" text-anchor="middle" class="node-note">原始记录</text>
  <path d="M320 926 H405" class="pass"/>
  <rect x="405" y="895" width="250" height="62" rx="31" class="pill"/>
  <text x="530" y="921" text-anchor="middle" class="node-title">Input Data Snapshot</text>
  <text x="530" y="941" text-anchor="middle" class="node-note">运行固定输入范围</text>
  <path d="M655 926 H740" class="pass"/>
  <rect x="740" y="895" width="285" height="62" rx="31" class="pill"/>
  <text x="882" y="921" text-anchor="middle" class="node-title">Step Output Versions</text>
  <text x="882" y="941" text-anchor="middle" class="node-note">Episode / Annotation Version 等</text>
  <path d="M1025 926 H1110" class="pass"/>
  <rect x="1110" y="895" width="270" height="62" rx="31" class="pill"/>
  <text x="1245" y="921" text-anchor="middle" class="node-title">Candidate Data Snapshot</text>
  <text x="1245" y="941" text-anchor="middle" class="node-note">处理完成后的候选范围</text>
  <path d="M1380 926 H1465" class="pass"/>
  <rect x="1465" y="895" width="245" height="62" rx="31" class="pill"/>
  <text x="1587" y="921" text-anchor="middle" class="node-title">Dataset Version</text>
  <text x="1587" y="941" text-anchor="middle" class="node-note">数据资产发布版本</text>
  <text x="900" y="984" text-anchor="middle" class="caption">每次转换记录输入、输出、Pipeline Version、Node Run、规则 / 算子版本、操作人与变更原因；节点重新执行产生新版本，不覆盖历史。</text>

  <text x="40" y="1041" class="caption">表达原则：主流程只展示稳定业务阶段；流程差异沉淀为 Pipeline Version；检查、抽样、验收和人工处理都是环节内节点，不再单独扩展成新的一级阶段。</text>
</svg>
