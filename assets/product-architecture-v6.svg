  <text x="475" y="680" text-anchor="middle" class="edge-label">发布流程版本</text>
  <path d="M825 640 V682 H1155 V730" class="edge-blue"/>
  <text x="990" y="680" text-anchor="middle" class="edge-label">发布组件版本</text>
  <path d="M1292 640 V682 H1202 V695" class="edge-gray edge-dashed"/>
  <text x="1270" y="680" text-anchor="middle" class="edge-label">固定引用配置版本</text>

  <path d="M1680 410 V695" class="edge-both"/>
  <rect x="1648" y="495" width="63" height="118" rx="8" fill="#ffffff" stroke="#a7b3c4"/>
  <text x="1679" y="523" text-anchor="middle" class="edge-label">业务命令</text>
  <text x="1679" y="548" text-anchor="middle" class="edge-label">查询</text>
  <text x="1679" y="573" text-anchor="middle" class="edge-label">运行状态</text>
  <text x="1679" y="598" text-anchor="middle" class="edge-label">数据视图</text>

  <!-- Layer 4: Foundation -->
  <rect x="65" y="990" width="135" height="120" rx="13" class="rail-foundation"/>
  <text x="132" y="1038" text-anchor="middle" class="layer-title">数据与平台底座</text>
  <text x="132" y="1062" text-anchor="middle" class="layer-en">FOUNDATION</text>
  <text x="132" y="1087" text-anchor="middle" class="menu-note">共享基础能力</text>

  <rect x="220" y="990" width="1515" height="120" rx="13" class="layer-foundation"/>
  <rect x="245" y="1018" width="205" height="62" rx="9" class="card"/>
