  <rect x="905" y="1018" width="205" height="62" rx="9" class="card"/>
  <text x="1007" y="1045" text-anchor="middle" class="foundation-title">租户、项目与权限</text>
  <text x="1007" y="1067" text-anchor="middle" class="menu-note">IAM · Tenant · Project</text>
  <rect x="1125" y="1018" width="205" height="62" rx="9" class="card"/>
  <text x="1227" y="1045" text-anchor="middle" class="foundation-title">日志、监控与审计</text>
  <text x="1227" y="1067" text-anchor="middle" class="menu-note">Logs · Metrics · Audit</text>
  <rect x="1345" y="1018" width="270" height="62" rx="9" class="card"/>
  <text x="1480" y="1045" text-anchor="middle" class="foundation-title">开放接口与集成</text>
  <text x="1480" y="1067" text-anchor="middle" class="menu-note">API · Webhook · SDK</text>

  <path d="M940 960 V990" class="edge-gray"/>

  <circle cx="75" cy="1165" r="5" fill="#4f82df"/>
  <text x="90" y="1170" class="legend">蓝色：配置发布与自动运行关系</text>
  <circle cx="370" cy="1165" r="5" fill="#2a9d72"/>
  <text x="385" y="1170" class="legend">绿色：人工任务分配与执行关系</text>
  <line x1="690" y1="1165" x2="730" y2="1165" stroke="#728096" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="742" y="1170" class="legend">虚线：运行时固定引用配置版本</text>
  <text x="1050" y="1170" class="legend">关键边界：菜单是产品入口；真正维护状态与执行语义的是核心引擎。</text>
</svg>
