<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Quanta 数据平台产品架构</title>
  <desc id="desc">展示任务中心、工作台、工作流、配置管理、资产管理和运营管理六个产品模块的菜单结构及关系。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0 0 L0 8 L10 4 Z" fill="#4f82df"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0 0 L0 8 L10 4 Z" fill="#6f7c90"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0 0 L0 8 L10 4 Z" fill="#2a9d72"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #202a3a; }
      .title { font-size: 31px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #68758b; }
      .boundary { fill: #fbfcfe; stroke: #a7b3c4; stroke-width: 1.4; stroke-dasharray: 8 6; }
      .task { fill: #eef4ff; stroke: #5f83ce; stroke-width: 1.8; }
      .workbench { fill: #eff9f5; stroke: #3b9a78; stroke-width: 1.6; }
      .workflow { fill: #f3efff; stroke: #8568c8; stroke-width: 1.6; }
      .config { fill: #fff8e9; stroke: #d49a47; stroke-width: 1.6; }
      .asset { fill: #fff3e8; stroke: #d9803e; stroke-width: 1.6; }
      .operation { fill: #f3f6fa; stroke: #7e8ea7; stroke-width: 1.6; }
      .menu { fill: rgba(255,255,255,0.9); stroke: #9ba9bc; stroke-width: 1.1; }
      .menu-blue { fill: #ffffff; stroke: #7e9edc; stroke-width: 1.2; }
      .module-title { font-size: 22px; font-weight: 700; }
      .module-note { font-size: 12.5px; fill: #637087; }
      .menu-title { font-size: 17px; font-weight: 650; }
      .menu-note { font-size: 12.5px; fill: #68758b; }
      .tag { fill: #edf3ff; stroke: #9fb5e6; stroke-width: 1; }
      .tag-green { fill: #edf8f4; stroke: #8ec7b3; stroke-width: 1; }
      .tag-text { font-size: 11.5px; fill: #52647e; }
      .edge { fill: none; stroke: #6f7c90; stroke-width: 1.5; marker-end: url(#arrow-gray); }
      .edge-blue { fill: none; stroke: #4f82df; stroke-width: 1.8; marker-end: url(#arrow-blue); }
      .edge-green { fill: none; stroke: #2a9d72; stroke-width: 1.8; marker-end: url(#arrow-green); }
      .edge-dashed { stroke-dasharray: 7 5; }
      .edge-label { font-size: 11.5px; fill: #59677d; }
      .section-label { font-size: 14px; font-weight: 650; fill: #5e6d82; }
      .legend { font-size: 12px; fill: #68758b; }
    </style>
  </defs>

  <rect width="1800" height="1000" fill="#ffffff"/>
  <text x="40" y="46" class="title">Quanta 数据平台产品架构</text>
  <text x="40" y="75" class="subtitle">以任务中心组织业务对象，工作流提供运行能力，配置管理提供可复用配置，工作台承接人工执行，资产管理沉淀数据集，运营管理提供组织与权限。</text>

  <rect x="40" y="105" width="1720" height="825" rx="18" class="boundary"/>
  <rect x="70" y="91" width="170" height="28" rx="14" fill="#ffffff" stroke="#a7b3c4"/>
  <text x="155" y="110" text-anchor="middle" class="section-label">Quanta 产品模块</text>

  <!-- Task center -->
  <rect x="65" y="140" width="1010" height="365" rx="15" class="task"/>
  <text x="95" y="177" class="module-title">任务中心</text>
  <text x="95" y="201" class="module-note">面向业务人员统一创建和查看采集、处理任务及其数据进度</text>

  <rect x="90" y="225" width="270" height="235" rx="11" class="menu-blue"/>
  <text x="225" y="258" text-anchor="middle" class="menu-title">采集任务</text>
  <text x="225" y="282" text-anchor="middle" class="menu-note">创建、下发和跟踪数据采集任务</text>
  <rect x="112" y="306" width="226" height="32" rx="7" class="tag"/>
  <text x="225" y="327" text-anchor="middle" class="tag-text">指令采集</text>
  <rect x="112" y="347" width="226" height="32" rx="7" class="tag"/>
  <text x="225" y="368" text-anchor="middle" class="tag-text">自由采集</text>
  <rect x="112" y="388" width="226" height="32" rx="7" class="tag"/>
  <text x="225" y="409" text-anchor="middle" class="tag-text">DAgger 采集</text>
  <text x="225" y="443" text-anchor="middle" class="menu-note">适配预训练与 Demo 场景</text>

  <rect x="390" y="225" width="390" height="235" rx="11" class="menu-blue"/>
  <text x="585" y="258" text-anchor="middle" class="menu-title">处理任务</text>
  <text x="585" y="282" text-anchor="middle" class="menu-note">不同业务可绑定不同处理流程</text>
  <rect x="418" y="310" width="145" height="92" rx="9" class="tag"/>
  <text x="490" y="337" text-anchor="middle" class="menu-title">清洗环节</text>
  <text x="490" y="361" text-anchor="middle" class="menu-note">节点 1 · 节点 2</text>
  <text x="490" y="382" text-anchor="middle" class="menu-note">… · 节点 N</text>
  <path d="M563 356 H607" class="edge-blue"/>
  <rect x="607" y="310" width="145" height="92" rx="9" class="tag-green"/>
  <text x="679" y="337" text-anchor="middle" class="menu-title">标注环节</text>
  <text x="679" y="361" text-anchor="middle" class="menu-note">节点 1 · 节点 2</text>
  <text x="679" y="382" text-anchor="middle" class="menu-note">… · 节点 N</text>
  <text x="585" y="432" text-anchor="middle" class="menu-note">每个环节由多个自动节点或人工节点构成</text>

  <rect x="810" y="225" width="240" height="235" rx="11" class="menu-blue"/>
  <text x="930" y="258" text-anchor="middle" class="menu-title">数据管理</text>
  <text x="930" y="287" text-anchor="middle" class="menu-note">以数据集维度组织查看</text>
  <rect x="835" y="313" width="190" height="38" rx="7" class="tag"/>
  <text x="930" y="338" text-anchor="middle" class="tag-text">数据处理进度</text>
  <rect x="835" y="363" width="190" height="38" rx="7" class="tag"/>
  <text x="930" y="388" text-anchor="middle" class="tag-text">数据版本</text>
  <text x="930" y="432" text-anchor="middle" class="menu-note">查看任务与数据的关联状态</text>

  <!-- Workbench -->
  <rect x="1105" y="140" width="300" height="365" rx="15" class="workbench"/>
  <text x="1135" y="177" class="module-title">工作台</text>
  <text x="1135" y="201" class="module-note">承接人工节点的任务执行</text>
  <rect x="1135" y="235" width="240" height="92" rx="10" class="menu"/>
  <text x="1255" y="270" text-anchor="middle" class="menu-title">工作台</text>
  <text x="1255" y="296" text-anchor="middle" class="menu-note">领取 · 预览 · 操作 · 提交</text>
  <rect x="1135" y="350" width="240" height="92" rx="10" class="menu"/>
  <text x="1255" y="385" text-anchor="middle" class="menu-title">个人看板</text>
  <text x="1255" y="411" text-anchor="middle" class="menu-note">待办 · 进度 · 效率 · 反馈</text>

  <!-- Operations -->
  <rect x="1435" y="140" width="300" height="365" rx="15" class="operation"/>
  <text x="1465" y="177" class="module-title">运营管理</text>
  <text x="1465" y="201" class="module-note">提供生产组织与访问权限</text>
  <rect x="1465" y="230" width="240" height="62" rx="9" class="menu"/>
  <text x="1585" y="257" text-anchor="middle" class="menu-title">供应商管理</text>
  <text x="1585" y="279" text-anchor="middle" class="menu-note">供应商与合作组织</text>
  <rect x="1465" y="312" width="240" height="62" rx="9" class="menu"/>
  <text x="1585" y="339" text-anchor="middle" class="menu-title">人员管理</text>
  <text x="1585" y="361" text-anchor="middle" class="menu-note">人员 · 技能 · 组织关系</text>
  <rect x="1465" y="394" width="240" height="62" rx="9" class="menu"/>
  <text x="1585" y="421" text-anchor="middle" class="menu-title">权限管理</text>
  <text x="1585" y="443" text-anchor="middle" class="menu-note">角色 · 项目 · 资源权限</text>

  <!-- Workflow -->
  <rect x="65" y="570" width="640" height="305" rx="15" class="workflow"/>
  <text x="95" y="607" class="module-title">工作流</text>
  <text x="95" y="631" class="module-note">定义处理流程并记录每次运行</text>
  <rect x="95" y="660" width="270" height="78" rx="10" class="menu"/>
  <text x="230" y="691" text-anchor="middle" class="menu-title">流程管理</text>
  <text x="230" y="715" text-anchor="middle" class="menu-note">环节 · 节点 · 连线 · 版本</text>
  <rect x="395" y="660" width="270" height="78" rx="10" class="menu"/>
  <text x="530" y="691" text-anchor="middle" class="menu-title">执行记录</text>
  <text x="530" y="715" text-anchor="middle" class="menu-note">Run · Node Run · 日志 · 输出</text>
  <rect x="95" y="758" width="270" height="78" rx="10" class="menu"/>
  <text x="230" y="789" text-anchor="middle" class="menu-title">算子管理</text>
  <text x="230" y="813" text-anchor="middle" class="menu-note">注册 · 版本 · 调试 · 发布</text>
  <rect x="395" y="758" width="270" height="78" rx="10" class="menu"/>
  <text x="530" y="789" text-anchor="middle" class="menu-title">工作台管理</text>
  <text x="530" y="813" text-anchor="middle" class="menu-note">Schema · 组件 · 数据绑定</text>

  <!-- Configuration -->
  <rect x="735" y="570" width="500" height="305" rx="15" class="config"/>
  <text x="765" y="607" class="module-title">配置管理</text>
  <text x="765" y="631" class="module-note">维护任务和流程共同引用的基础配置</text>
  <rect x="765" y="660" width="205" height="78" rx="10" class="menu"/>
  <text x="867" y="691" text-anchor="middle" class="menu-title">规则管理</text>
  <text x="867" y="715" text-anchor="middle" class="menu-note">检查规则与参数</text>
  <rect x="1000" y="660" width="205" height="78" rx="10" class="menu"/>
  <text x="1102" y="691" text-anchor="middle" class="menu-title">场景管理</text>
  <text x="1102" y="715" text-anchor="middle" class="menu-note">业务场景与默认配置</text>
  <rect x="765" y="758" width="205" height="78" rx="10" class="menu"/>
  <text x="867" y="789" text-anchor="middle" class="menu-title">指令管理</text>
  <text x="867" y="813" text-anchor="middle" class="menu-note">采集指令与模板</text>
  <rect x="1000" y="758" width="205" height="78" rx="10" class="menu"/>
  <text x="1102" y="789" text-anchor="middle" class="menu-title">标签管理</text>
  <text x="1102" y="813" text-anchor="middle" class="menu-note">标签组与标注 Schema</text>

  <!-- Assets -->
  <rect x="1265" y="570" width="470" height="305" rx="15" class="asset"/>
  <text x="1295" y="607" class="module-title">资产管理</text>
  <text x="1295" y="631" class="module-note">沉淀并管理可复用的数据集资产</text>
  <rect x="1295" y="665" width="410" height="165" rx="11" class="menu"/>
  <text x="1500" y="704" text-anchor="middle" class="menu-title">数据集管理</text>
  <text x="1500" y="734" text-anchor="middle" class="menu-note">构建 · 版本 · 发布 · 废弃</text>
  <text x="1500" y="761" text-anchor="middle" class="menu-note">血缘 · 权限 · 训练 / 评测消费</text>
  <rect x="1350" y="786" width="125" height="27" rx="6" class="tag"/>
  <text x="1412" y="804" text-anchor="middle" class="tag-text">Dataset</text>
  <rect x="1488" y="786" width="162" height="27" rx="6" class="tag"/>
  <text x="1569" y="804" text-anchor="middle" class="tag-text">Dataset Version</text>

  <!-- Module relations -->
  <path d="M585 460 V535 H385 V570" class="edge-blue"/>
  <text x="485" y="527" text-anchor="middle" class="edge-label">处理任务绑定流程版本并生成执行记录</text>

  <path d="M780 330 H1105" class="edge-green"/>
  <text x="942" y="320" text-anchor="middle" class="edge-label">人工节点生成待办</text>
  <path d="M1105 405 H780" class="edge-green edge-dashed"/>
  <text x="942" y="398" text-anchor="middle" class="edge-label">提交执行结果</text>

  <path d="M930 460 V535 H1500 V570" class="edge"/>
  <text x="1215" y="527" text-anchor="middle" class="edge-label">候选数据与版本进入数据集管理</text>

  <path d="M985 570 V545 H1015 V505" class="edge edge-dashed"/>
  <text x="1010" y="552" class="edge-label">提供规则、场景、指令和标签</text>

  <path d="M1435 275 H1405" class="edge edge-dashed"/>
  <text x="1420" y="264" text-anchor="middle" class="edge-label">人员</text>
  <path d="M1435 430 H1405" class="edge edge-dashed"/>
  <text x="1420" y="419" text-anchor="middle" class="edge-label">权限</text>

  <circle cx="75" cy="954" r="5" fill="#4f82df"/>
  <text x="90" y="959" class="legend">蓝色：业务任务与工作流运行关系</text>
  <circle cx="350" cy="954" r="5" fill="#2a9d72"/>
  <text x="365" y="959" class="legend">绿色：人工任务进入工作台并回写结果</text>
  <line x1="690" y1="954" x2="730" y2="954" stroke="#6f7c90" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="742" y="959" class="legend">虚线：配置、人员和权限支撑关系</text>
  <text x="1160" y="959" class="legend">产品边界：数据集构建与发布归资产管理；工作流不拥有数据集生命周期。</text>
</svg>
