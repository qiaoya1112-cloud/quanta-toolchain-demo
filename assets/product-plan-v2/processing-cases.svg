<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="900" viewBox="0 0 2000 900">
  <title>典型处理流程 Case</title>
  <desc>人工与自动化混排、纯算子编排和多轮人工流程共用统一引擎模型。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#94A3B8"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
    </style>
  </defs>
  <rect width="2000" height="900" fill="#FFFFFF"/>
  <text x="48" y="48" font-size="30" fill="#1E293B" font-weight="600" text-anchor="start"><tspan x="48" dy="0">典型处理流程 Case</tspan></text>
  <text x="48" y="82" font-size="18" fill="#64748B" font-weight="400" text-anchor="start"><tspan x="48" dy="0">人工与自动化混排、纯算子编排和多轮人工流程共用统一引擎模型。</tspan></text>
<rect x="42" y="132" width="610" height="676" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="64" y="167" font-size="21" fill="#1E293B" font-weight="600" text-anchor="start"><tspan x="64" dy="0">Case 1｜自动与人工混合</tspan></text><text x="64" y="194" font-size="14" fill="#64748B" font-weight="400" text-anchor="start"><tspan x="64" dy="0">适用于正式生产流程</tspan></text><rect x="686" y="132" width="610" height="676" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="708" y="167" font-size="21" fill="#1E293B" font-weight="600" text-anchor="start"><tspan x="708" dy="0">Case 2｜纯算子编排</tspan></text><text x="708" y="194" font-size="14" fill="#64748B" font-weight="400" text-anchor="start"><tspan x="708" dy="0">适用于批处理与标准化</tspan></text><rect x="1330" y="132" width="610" height="676" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="1352" y="167" font-size="21" fill="#1E293B" font-weight="600" text-anchor="start"><tspan x="1352" dy="0">Case 3｜多轮人工处理</tspan></text><text x="1352" y="194" font-size="14" fill="#64748B" font-weight="400" text-anchor="start"><tspan x="1352" dy="0">适用于新规则或复杂数据</tspan></text><rect x="200" y="224" width="294" height="58" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="347.0" y="260.0" font-size="16" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="347.0" dy="0">输入数据</tspan></text><rect x="200" y="316" width="294" height="58" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="347.0" y="352.0" font-size="16" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="347.0" dy="0">自动检查</tspan></text><rect x="200" y="408" width="294" height="58" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="7 6"/><text x="347.0" y="444.0" font-size="16" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="347.0" dy="0">是否需人工</tspan></text><rect x="200" y="500" width="294" height="58" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="347.0" y="536.0" font-size="16" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="347.0" dy="0">人工处理</tspan></text><rect x="200" y="592" width="294" height="58" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="347.0" y="628.0" font-size="16" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="347.0" dy="0">自动切分</tspan></text><rect x="200" y="684" width="294" height="58" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><text x="347.0" y="720.0" font-size="16" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="347.0" dy="0">结果版本</tspan></text><line x1="347" y1="282" x2="347" y2="316" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/><line x1="347" y1="374" x2="347" y2="408" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/><line x1="347" y1="466" x2="347" y2="500" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/><line x1="347" y1="558" x2="347" y2="592" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/><line x1="347" y1="650" x2="347" y2="684" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/><text x="522" y="452" font-size="13" fill="#64748B" font-weight="500" text-anchor="middle"><tspan x="522" dy="0">人工节点生成任务</tspan></text><text x="522" y="544" font-size="13" fill="#64748B" font-weight="500" text-anchor="middle"><tspan x="522" dy="0">提交后回写流程</tspan></text><rect x="844" y="224" width="294" height="58" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="991.0" y="260.0" font-size="16" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="991.0" dy="0">输入数据</tspan></text><line x1="991" y1="282" x2="991" y2="316" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/><rect x="844" y="316" width="294" height="58" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="991.0" y="352.0" font-size="16" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="991.0" dy="0">格式校验</tspan></text><line x1="991" y1="374" x2="991" y2="408" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/><rect x="844" y="408" width="294" height="58" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="991.0" y="444.0" font-size="16" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="991.0" dy="0">时间对齐</tspan></text><line x1="991" y1="466" x2="991" y2="500" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/><rect x="844" y="500" width="294" height="58" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="991.0" y="536.0" font-size="16" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="991.0" dy="0">Episode 切分</tspan></text><line x1="991" y1="558" x2="991" y2="592" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/><rect x="844" y="592" width="294" height="58" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="991.0" y="628.0" font-size="16" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="991.0" dy="0">统计与过滤</tspan></text><line x1="991" y1="650" x2="991" y2="684" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/><rect x="844" y="684" width="294" height="58" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><text x="991.0" y="720.0" font-size="16" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="991.0" dy="0">结果版本</tspan></text><text x="991" y="782" font-size="13" fill="#1E293B" font-weight="500" text-anchor="middle"><tspan x="991" dy="0">不生成 Human Task</tspan></text><rect x="1488" y="224" width="294" height="58" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="1635.0" y="260.0" font-size="16" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="1635.0" dy="0">输入数据</tspan></text><line x1="1635" y1="282" x2="1635" y2="316" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/><rect x="1488" y="316" width="294" height="58" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="1635.0" y="352.0" font-size="16" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="1635.0" dy="0">人工标注</tspan></text><line x1="1635" y1="374" x2="1635" y2="408" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/><rect x="1488" y="408" width="294" height="58" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="1635.0" y="444.0" font-size="16" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="1635.0" dy="0">抽样检查</tspan></text><line x1="1635" y1="466" x2="1635" y2="500" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/><rect x="1488" y="500" width="294" height="58" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="7 6"/><text x="1635.0" y="536.0" font-size="16" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="1635.0" dy="0">是否通过</tspan></text><line x1="1635" y1="558" x2="1635" y2="592" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/><rect x="1488" y="592" width="294" height="58" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="1635.0" y="628.0" font-size="16" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="1635.0" dy="0">退回原节点 / 继续</tspan></text><line x1="1635" y1="650" x2="1635" y2="684" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/><rect x="1488" y="684" width="294" height="58" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><text x="1635.0" y="720.0" font-size="16" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="1635.0" dy="0">结果版本</tspan></text><path d="M 1488 622 L 1438 622 L 1438 345 L 1488 345" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow-gray)" stroke-dasharray="7 6"/><text x="1430" y="494" font-size="13" fill="#64748B" font-weight="500" text-anchor="end"><tspan x="1430" dy="0">退回</tspan></text><rect x="42" y="838" width="1898" height="42" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><text x="991" y="865" font-size="14" fill="#1E293B" font-weight="500" text-anchor="middle"><tspan x="991" dy="0">三类 Case 共用同一套 Flow、Node、Run 和 Result Version 对象，只改变节点组合、条件和人工协作配置。</tspan></text></svg>
