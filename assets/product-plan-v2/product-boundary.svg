eight="98" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="496.0" y="220" font-size="18" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="496.0" dy="0">任务管理</tspan></text><text x="496.0" y="246" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle"><tspan x="496.0" dy="0">采集任务 · 处理任务</tspan><tspan x="496.0" dy="21">分配管理</tspan></text><rect x="660" y="190" width="244" height="98" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="782.0" y="220" font-size="18" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="782.0" dy="0">流程与配置</tspan></text><text x="782.0" y="246" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle"><tspan x="782.0" dy="0">流程 · 算子 · 工作台</tspan><tspan x="782.0" dy="21">规则 · 场景 · 标签</tspan></text><rect x="946" y="190" width="244" height="98" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="1068.0" y="220" font-size="18" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="1068.0" dy="0">人工协作</tspan></text><text x="1068.0" y="246" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle"><tspan x="1068.0" dy="0">用户组 · 任务池</tspan><tspan x="1068.0" dy="21">领取 · 锁定 · 提交</tspan></text><rect x="374" y="352" width="236" height="116" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><text x="492.0" y="382" font-size="18" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="492.0" dy="0">持续接入</tspan></text><text x="492.0" y="408" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle"><tspan x="492.0" dy="0">筛选条件</tspan><tspan x="492.0" dy="21">开启状态 · 处理水位</tspan></text><rect x="666" y="352" width="236" height="116" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><text x="784.0" y="382" font-size="18" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="784.0" dy="0">工作流引擎</tspan></text><text x="784.0" y="408" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle"><tspan x="784.0" dy="0">自动 / 人工 / 条件节点</tspan><tspan x="784.0" dy="21">独立 Flow Run</tspan></text><rect x="958" y="352" width="236" height="116" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><text x="1076.0" y="382" font-size="18" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="1076.0" dy="0">执行运行时</tspan></text><text x="1076.0" y="408" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle"><tspan x="1076.0" dy="0">Operator Runtime</tspan><tspan x="1076.0" dy="21">Workbench Runtime</tspan></text><line x1="610" y1="410" x2="666" y2="410" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/><line x1="902" y1="410" x2="958" y2="410" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/><text x="784" y="507" font-size="13" fill="#64748B" font-weight="500" text-anchor="middle"><tspan x="784" dy="0">处理结果与血缘写回数据资产</tspan></text><rect x="1284" y="118" width="568" height="500" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="1306" y="153" font-size="21" fill="#1E293B" font-weight="600" text-anchor="start"><tspan x="1306" dy="0">数据资产</tspan></text><text x="1306" y="180" font-size="14" fill="#64748B" font-weight="400" text-anchor="start"><tspan x="1306" dy="0">管理数据事实与可消费版本</tspan></text><rect x="1320" y="190" width="230" height="98" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="1435.0" y="220" font-size="18" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="1435.0" dy="0">数据管理</tspan></text><text x="1435.0" y="246" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle"><tspan x="1435.0" dy="0">Recording 检索</tspan><tspan x="1435.0" dy="21">处理结果 · 版本 · 血缘</tspan></text><rect x="1582" y="190" width="230" height="98" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="1697.0" y="220" font-size="18" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="1697.0" dy="0">数据集管理</tspan></text><text x="1697.0" y="246" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle"><tspan x="1697.0" dy="0">筛选 · 快照 · 构建</tspan><tspan x="1697.0" dy="21">发布 · 回滚 · 消费</tspan></text><rect x="1320" y="352" width="492" height="116" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><text x="1566.0" y="382" font-size="18" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="1566.0" dy="0">版本化数据资产</tspan></text><text x="1566.0" y="408" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle"><tspan x="1566.0" dy="0">Processing Result Version → Data Snapshot → Dataset Version</tspan></text><line x1="1238" y1="408" x2="1320" y2="408" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/><path d="M 292 468 L 324 468 L 324 410 L 374 410" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/><path d="M 1320 250 L 1264 250 L 1264 334 L 492 334 L 492 352" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow-gray)"/><text x="915" y="323" font-size="13" fill="#64748B" font-weight="500" text-anchor="middle"><tspan x="915" dy="0">处理任务持续读取命中数据</tspan></text><rect x="338" y="670" width="1514" height="176" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="360" y="705" font-size="21" fill="#1E293B" font-weight="600" text-anchor="start"><tspan x="360" dy="0">运营与平台支撑</tspan></text><text x="360" y="732" font-size="14" fill="#64748B" font-weight="400" text-anchor="start"><tspan x="360" dy="0">提供组织与治理能力，不承载流程运行状态</tspan></text><rect x="374" y="735" width="310" height="76" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="529.0" y="765" font-size="16" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="529.0" dy="0">供应商与人员</tspan></text><text x="529.0" y="791" font-size="13" fill="#64748B" font-weight="400" text-anchor="middle"><tspan x="529.0" dy="0">组织、技能、产能</tspan></text><rect x="730" y="735" width="310" height="76" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="885.0" y="765" font-size="16" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="885.0" dy="0">用户组与权限</tspan></text><text x="885.0" y="791" font-size="13" fill="#64748B" font-weight="400" text-anchor="middle"><tspan x="885.0" dy="0">菜单、数据范围、作业资格</tspan></text><rect x="1086" y="735" width="310" height="76" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="1241.0" y="765" font-size="16" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="1241.0" dy="0">平台底座</tspan></text><text x="1241.0" y="791" font-size="13" fill="#64748B" font-weight="400" text-anchor="middle"><tspan x="1241.0" dy="0">存储、队列、检索、开放接口</tspan></text><rect x="1442" y="735" width="310" height="76" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="1597.0" y="765" font-size="16" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="1597.0" dy="0">治理与审计</tspan></text><text x="1597.0" y="791" font-size="13" fill="#64748B" font-weight="400" text-anchor="middle"><tspan x="1597.0" dy="0">租户、日志、监控、告警</tspan></text><path d="M 1040 618 L 1040 646 L 1095 646 L 1095 670" stroke="#94A3B8" stroke-width="2" fill="none" stroke-dasharray="7 6"/></svg>
