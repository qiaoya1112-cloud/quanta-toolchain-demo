  <text x="48" y="48" font-size="30" fill="#1E293B" font-weight="600" text-anchor="start"><tspan x="48" dy="0">产品边界与核心模块关系</tspan></text>
  <text x="48" y="82" font-size="18" fill="#64748B" font-weight="400" text-anchor="start"><tspan x="48" dy="0">数据 Pipeline 负责持续接入与执行；数据资产负责数据集生命周期；运营管理提供人员和组织支撑。</tspan></text>
