dth="1.5"/><text x="1455.0" y="240" font-size="16" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="1455.0" dy="0">人工节点 E</tspan></text><text x="1455.0" y="266" font-size="13" fill="#64748B" font-weight="400" text-anchor="middle"><tspan x="1455.0" dy="0">流程 C</tspan></text><rect x="1640" y="210" width="250" height="88" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="1765.0" y="240" font-size="16" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="1765.0" dy="0">人工节点 F</tspan></text><text x="1765.0" y="266" font-size="13" fill="#64748B" font-weight="400" text-anchor="middle"><tspan x="1765.0" dy="0">流程 D</tspan></text><rect x="42" y="398" width="1916" height="246" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="64" y="433" font-size="21" fill="#1E293B" font-weight="600" text-anchor="start"><tspan x="64" dy="0">用户组任务池</tspan></text><text x="64" y="460" font-size="14" fill="#64748B" font-weight="400" text-anchor="start"><tspan x="64" dy="0">节点配置用户组；任务池是可领取视图，不复制业务任务</tspan></text><rect x="180" y="486" width="420" height="106" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><text x="390.0" y="516" font-size="18" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="390.0" dy="0">标注员用户组</tspan></text><text x="390.0" y="542" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle"><tspan x="390.0" dy="0">任务池 · 10 人</tspan><tspan x="390.0" dy="21">pending Human Task</tspan></text><rect x="700" y="486" width="420" height="106" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><text x="910.0" y="516" font-size="18" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="910.0" dy="0">标注抽检员用户组</tspan></text><text x="910.0" y="542" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle"><tspan x="910.0" dy="0">任务池 · 20 人</tspan><tspan x="910.0" dy="21">pending Human Task</tspan></text><rect x="1220" y="486" width="420" height="106" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><text x="1430.0" y="516" font-size="18" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="1430.0" dy="0">新规实验标注员用户组</tspan></text><text x="1430.0" y="542" font-size="14" fill="#64748B" font-weight="400" text-anchor="middle"><tspan x="1430.0" dy="0">任务池 · 8 人</tspan><tspan x="1430.0" dy="21">pending Human Task</tspan></text><path d="M 215 298 L 215 380 L 390 380 L 390 486" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow-gray)"/><path d="M 525 298 L 525 380 L 910 380 L 910 486" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow-gray)"/><path d="M 835 298 L 835 380 L 390 380 L 390 486" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow-gray)"/><path d="M 1145 298 L 1145 380 L 910 380 L 910 486" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow-gray)"/><path d="M 1455 298 L 1455 380 L 1430 380 L 1430 486" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow-gray)"/><path d="M 1765 298 L 1765 380 L 1430 380 L 1430 486" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow-gray)"/><rect x="42" y="688" width="1916" height="214" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="64" y="723" font-size="21" fill="#1E293B" font-weight="600" text-anchor="start"><tspan x="64" dy="0">领取与执行</tspan></text><text x="64" y="750" font-size="14" fill="#64748B" font-weight="400" text-anchor="start"><tspan x="64" dy="0">组内成员领取后进入节点绑定的工作台</tspan></text><rect x="160" y="760" width="300" height="88" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="310.0" y="790" font-size="16" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="310.0" dy="0">用户 A</tspan></text><text x="310.0" y="816" font-size="13" fill="#64748B" font-weight="400" text-anchor="middle"><tspan x="310.0" dy="0">标注员组</tspan></text><rect x="570" y="760" width="300" height="88" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="720.0" y="790" font-size="16" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="720.0" dy="0">用户 B</tspan></text><text x="720.0" y="816" font-size="13" fill="#64748B" font-weight="400" text-anchor="middle"><tspan x="720.0" dy="0">标注员 + 抽检员组</tspan></text><rect x="980" y="760" width="300" height="88" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="1130.0" y="790" font-size="16" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="1130.0" dy="0">用户 C</tspan></text><text x="1130.0" y="816" font-size="13" fill="#64748B" font-weight="400" text-anchor="middle"><tspan x="1130.0" dy="0">抽检员组</tspan></text><rect x="1390" y="760" width="300" height="88" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="1540.0" y="790" font-size="16" fill="#1E293B" font-weight="600" text-anchor="middle"><tspan x="1540.0" dy="0">用户 D</tspan></text><text x="1540.0" y="816" font-size="13" fill="#64748B" font-weight="400" text-anchor="middle"><tspan x="1540.0" dy="0">新规实验组</tspan></text><path d="M 390 592 L 390 672 L 310 672 L 310 760" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/><path d="M 910 592 L 910 672 L 720 672 L 720 760" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/><path d="M 910 592 L 910 672 L 1130 672 L 1130 760" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/><path d="M 1430 592 L 1430 672 L 1540 672 L 1540 760" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/><text x="1000" y="934" font-size="13" fill="#1E293B" font-weight="500" text-anchor="middle"><tspan x="1000" dy="0">多组可见时仍是同一个 Human Task；首个成功领取者获得任务锁，提交结果回写原 Node Run。</tspan></text></svg>
