<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="980" viewBox="0 0 2000 980">
  <title>人工任务分配</title>
  <desc>节点绑定用户组，任务进入用户组任务池，组内成员领取并在工作台执行。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#94A3B8"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
    </style>
  </defs>
  <rect width="2000" height="980" fill="#FFFFFF"/>
  <text x="48" y="48" font-size="30" fill="#1E293B" font-weight="600" text-anchor="start"><tspan x="48" dy="0">人工任务分配</tspan></text>
  <text x="48" y="82" font-size="18" fill="#64748B" font-weight="400" text-anchor="start"><tspan x="48" dy="0">节点绑定用户组，任务进入用户组任务池，组内成员领取并在工作台执行。</tspan></text>
