<!doctype html>
<html lang="zh-CN" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>滚动条</title>
<link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../component-preview.css"><link rel="stylesheet" href="../common-preview.css">
<style>.scrollbar-demo{max-width:720px;height:220px;overflow:auto;border:1px solid var(--color-border);border-radius:12px;background:var(--color-bg-input);padding:16px}.scrollbar-demo p{margin:0;padding:16px;border-bottom:1px solid var(--color-border);font-size:14px}.scrollbar-demo--horizontal{height:auto;overflow-x:scroll}.scrollbar-demo--horizontal>div{width:1400px;display:flex;gap:16px;padding-bottom:16px}.scrollbar-demo article{flex:1;padding:24px;border-radius:12px;background:var(--color-accent-gray-soft)}.scrollbar-demo--both>div{width:1200px}</style></head>
<body class="design-spec-page component-preview"><main class="component-gallery"><header class="component-gallery__header"><h1>滚动条</h1></header>
<section class="component-gallery__group"><h2>横向滚动</h2><div class="scrollbar-demo scrollbar-demo--horizontal" tabindex="0" role="region" aria-label="横向滚动示例"><div><article>任务信息</article><article>处理流程</article><article>节点进度</article><article>产能分配</article><article>操作记录</article></div></div></section>
<section class="component-gallery__group"><h2>纵向滚动</h2><div class="scrollbar-demo" tabindex="0" role="region" aria-label="纵向滚动示例" data-rows></div></section>
<section class="component-gallery__group"><h2>双向滚动</h2><div class="scrollbar-demo scrollbar-demo--both" tabindex="0" role="region" aria-label="双向滚动示例"><div data-rows></div></div></section>
</main><script>document.querySelectorAll('[data-rows]').forEach(el=>{for(let i=1;i<=16;i++){const row=document.createElement('p');row.textContent=`示例任务 ${String(i).padStart(2,'0')}　　处理流程　　当前节点　　处理中`;el.append(row);}});</script></body></html>
