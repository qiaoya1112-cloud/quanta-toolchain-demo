<body data-page-id="command-package-management"><div class="process-page">
<aside class="process-page__sidebar"><platform-sidebar variant="style-variant" palette="dark"></platform-sidebar></aside>
<main class="process-page__main" aria-label="指令包管理内容区">
<task-page-header title="指令包管理" action="创建指令包"></task-page-header>
<section class="command-content">
<task-filter-bar variant="collection"><form class="command-filters" aria-label="指令包管理筛选"><div class="task-filter-grid collection-filter-grid" style="--collection-filter-count:5"><form-input name="id" label="指令包 ID" placeholder="输入指令包 ID"></form-input><form-input name="name" label="指令包名称" placeholder="输入指令包名称"></form-input><form-select name="scene" label="场景"><option value="">全部场景</option><option>家庭</option><option>办公</option></form-select><form-select name="workspace" label="工作区"><option value="">全部工作区</option><option>书房</option><option>厨房</option><option>客厅</option><option>办公区</option></form-select><form-select name="status" label="状态"><option value="">全部状态</option><option>待发布</option><option>上线</option><option>下线</option></form-select></div></form></task-filter-bar>
<div class="task-data-table command-table"><div class="task-data-table__scroll">
<table aria-label="指令包管理列表"><colgroup><col style="width:130px"><col style="width:180px"><col style="width:80px"><col style="width:90px"><col style="width:440px"><col style="width:110px"><col style="width:90px"><col style="width:180px"></colgroup><thead><tr><th scope="col">指令包 ID</th><th scope="col">指令包名称</th><th scope="col">场景</th><th scope="col">工作区</th><th scope="col">道具</th><th scope="col">指令包状态</th><th scope="col">指令总数</th><th scope="col">操作</th></tr></thead><tbody></tbody></table>
<p class="command-empty" data-empty hidden>暂无符合条件的数据</p>
</div><list-pagination total="0" page="1" page-size="10"></list-pagination></div>
<p data-feedback role="status" aria-live="polite"></p>
</section></main></div>
<dialog class="command-dialog" aria-labelledby="dialog-title"><header><h2 id="dialog-title"></h2><text-button variant="text" data-close aria-label="关闭弹窗">关闭</text-button></header><div data-dialog-content></div><footer><text-button variant="outline" data-close>关闭</text-button></footer></dialog>
