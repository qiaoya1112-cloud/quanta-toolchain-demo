<html lang="zh-CN" data-theme="light">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资源库</title>

<body data-page-id="resource-library"><div class="process-page resource-page"><aside class="process-page__sidebar"><platform-sidebar variant="style-variant" palette="dark"></platform-sidebar></aside><main class="process-page__main">
<task-page-header title="资源库"></task-page-header><nav class="resource-tabs task-status-tabs" aria-label="资源类型"><button data-tab="maps" aria-pressed="true">地图资源 <span>3</span></button><button data-tab="models" aria-pressed="false">模型能力</button></nav>
<section class="filters" aria-label="资源筛选"><form-select id="project" label="项目"><option value="">全部项目</option><option>京东仓内导航</option><option>宁德产线</option></form-select><label class="resource-search">资源名称 / ID<input id="search" class="form-input__control" type="search" placeholder="请输入资源名称或资源 ID"></label><div class="resource-status-field"><span>校验状态</span><div id="statuses" class="status-filters"></div></div><text-button id="validate" variant="outline">资源校验</text-button></section>
<div id="notice" role="status" aria-live="polite"></div>
<section class="resource-workspace"><div class="resource-master"><div class="list-heading"><h2 id="list-title">地图资源</h2><span id="count"></span></div><resource-list></resource-list></div><article id="detail" class="resource-detail"></article></section>
</main></div>
<dialog id="edit" class="confirm-dialog"><form id="edit-form"><h2>编辑资源信息</h2><label>资源名称<input id="edit-name" class="form-input__control" required maxlength="60"></label><label>描述<textarea id="edit-description" class="form-input__control" rows="3" maxlength="300"></textarea></label><div class="dialog-actions"><button type="button" id="cancel-edit" class="text-button">取消</button><button class="text-button text-button--primary">保存</button></div></form></dialog>
