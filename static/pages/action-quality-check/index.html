<body data-page-id="action-annotation" data-view="task-list" data-theme="light">
  <div class="page-shell">
    <aside class="page-sidebar" data-block="platform-sidebar">
      <platform-sidebar variant="style-variant" palette="dark"></platform-sidebar>
    </aside>

    <main class="page-workspace">
      <section class="task-list-view" aria-label="工作台">
        <task-page-header title="工作台"></task-page-header>
        <div class="task-list-view__main">
          <task-status-tabs variant="task-view" active="todo" data-view-tabs></task-status-tabs>
          <section class="annotation-todo" aria-label="待办项">
            <div class="todo-types task-status-subtabs" role="tablist" aria-label="待办分类"><button type="button" role="tab" data-type="rejected" class="is-active" aria-selected="true">驳回待处理</button><button type="button" role="tab" data-type="review" aria-selected="false">修正待审核</button><button type="button" role="tab" data-type="assigned" aria-selected="false">其他分配任务</button></div>
            <task-filter-bar variant="annotation-todo"></task-filter-bar>
            <div class="todo-layout"><aside class="todo-groups" aria-label="处理任务分组"></aside><div class="todo-results"><div class="todo-table-wrap"><table class="todo-table"><thead><tr><th>数据 ID</th><th>处理类型</th><th>来源操作</th><th>说明</th><th>当前轮次</th><th>更新时间 ↓</th><th>操作</th></tr></thead><tbody></tbody></table></div><div class="todo-pagination"><span>10 条/页</span><text-button disabled aria-label="上一页">‹</text-button><text-button variant="primary">1</text-button><text-button disabled aria-label="下一页">›</text-button></div><p class="todo-feedback" role="status"></p></div></div>
          </section>
          <section class="task-pool" aria-label="任务池" hidden>
            <task-filter-bar variant="workbench-pool"></task-filter-bar>
            <task-data-table variant="workbench-pool" rows="4"></task-data-table>
          </section>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
